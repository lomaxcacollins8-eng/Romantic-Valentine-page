<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Florence, A Special Valentine</title>
  <style>
    body {
      background: linear-gradient(to bottom right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container {
      padding: 50px 20px;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 8px #ff6f91;
    }
    .photo-section {
      margin: 30px 0;
    }
    .photo-section img {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }
    .photo-section img:hover {
      transform: scale(1.05);
    }
    .message {
      font-size: 1.2em;
      margin-top: 15px;
      color: #fff8f0;
    }
    .closing {
      font-size: 2em;
      margin-top: 40px;
      font-weight: bold;
      color: #ffdde1;
      text-shadow: 2px 2px 10px #ff6f91;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Florence, Will You Be My Valentine?</h1>

    <!-- Photo 1 -->
    <div class="photo-section">
      <img src="https://via.placeholder.com/300" alt="Florence Photo 1">
      <div class="message">Your smile lights up my world every day ❤️</div>
    </div>

    <!-- Photo 2 -->
    <div class="photo-section">
      <img src="https://via.placeholder.com/300" alt="Florence Photo 2">
      <div class="message">Every moment with you feels like a dream ✨</div>
    </div>

    <!-- Photo 3 -->
    <div class="photo-section">
      <img src="https://via.placeholder.com/300" alt="Florence Photo 3">
      <div class="message">I can't imagine life without you, my love 💖</div>
    </div>

    <!-- Closing -->
    <div class="closing">
      I loveee uuu, Florence! 💕
    </div>
  </div>
</body>
</html>
